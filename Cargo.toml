[workspace]
resolver = "2"
members = ["."]

[workspace.package]
version = "0.4.13"
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/faberline/courier"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "rustls-tls-native-roots", "json", "cookies", "gzip", "brotli", "multipart", "stream"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "trace"] }
utoipa = "4"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive", "string"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[package]
name = "courier"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "courier — stateless, GCP-hosted GitHub-issue proxy: forwards search/view/create/comment to GitHub with a server-held credential so CLIs authenticate with a shared bearer token instead of a personal GitHub token"

[lib]
name = "courier"
path = "src/lib.rs"

[[bin]]
name = "courier"
path = "src/bin/courier.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# HTTP/2 + OpenAPI surface
axum.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
utoipa = { workspace = true, features = ["axum_extras"] }

# Shared k8s-native HTTP service shell — standard probes, request tracing,
# h2c serve, graceful drain.
service-http = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Shared request-auth plumbing — StaticRoleMapVerifier is exactly the
# shared-bearer-token shape courier needs; no custom Verifier required.
service-auth = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Process-level rustls crypto provider install (reqwest's rustls-tls-native-roots
# backend needs a default provider installed once before the first TLS dial).
peer-tls = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Outbound calls to api.github.com (server-held credential).
reqwest = { workspace = true }
# Standard agent-facing CLI ops — llm/upgrade/issue.
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.14", default-features = false }

clap = { workspace = true, features = ["env"] }

[build-dependencies]
# Stamp COURIER_GIT_SHA / COURIER_BUILT_AT / COURIER_TARGET for cli-std's ToolInfo.
build-stamp = { git = "https://github.com/faberline/core", tag = "v0.4.14" }

[features]
default = []
# Online (HTTPS) paths of the standard CLI ops: `upgrade` self-install +
# courier's own `issue` search/view/create against GitHub directly (courier's
# dev tooling, not the proxy data plane it serves).
issue = ["cli-std/online"]
self-update = ["cli-std/online"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.12"
